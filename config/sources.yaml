# Source table configurations
# Each source has a 'name' (fully qualified table name in Databricks catalog)
# and an 'alias' which is used to refer to this source in transformation configurations
# and for linking to DQ rules.

sources:
  - name: "raw_catalog.raw_schema.astrid_disease_prevalence"
    alias: "astrid_disease_prevalence"
    description: "Source table containing disease prevalence data."

  - name: "raw_catalog.raw_schema.icd10lookup"
    alias: "icd10lookup"
    description: "Source table for ICD-10 code lookups and descriptions."

  - name: "raw_catalog.raw_schema.generic_multim_1to3"
    alias: "generic_multim_1to3"
    description: "Source table for generic medication information (Multum level 1 to 3)."

  - name: "raw_catalog.raw_schema.ndc_multum_1to3"
    alias: "ndc_multum_1to3"
    description: "Source table for NDC Multum medication data."

  - name: "raw_catalog.raw_schema.hcpcs_multum_1to3"
    alias: "hcpcs_multum_1to3"
    description: "Source table for HCPCS Multum medication data."

  - name: "raw_catalog.raw_schema.astrid_demographics_general_population_counts"
    alias: "astrid_demographics_general_population_counts"
    description: "Source table with general population demographic counts."

  - name: "raw_catalog.raw_schema.astrid_comorbidities"
    alias: "astrid_comorbidities"
    description: "Source table containing comorbidity data."

  - name: "raw_catalog.raw_schema.astrid_incidence_rates"
    alias: "astrid_incidence_rates"
    description: "Source table with incidence rates."

  - name: "raw_catalog.raw_schema.astrid_demographics_disease_population_counts"
    alias: "astrid_demographics_disease_population_counts"
    description: "Source table with disease-specific population demographic counts."

  - name: "raw_catalog.raw_schema.astrid_disease_incidence"
    alias: "astrid_disease_incidence"
    description: "Source table for disease incidence data."

  - name: "raw_catalog.raw_schema.astrid_hcru_disease_population"
    alias: "astrid_hcru_disease_population"
    description: "Source table for HCRU data for disease population."

  - name: "raw_catalog.raw_schema.astrid_hcru_general_population"
    alias: "astrid_hcru_general_population"
    description: "Source table for HCRU data for general population."

  - name: "raw_catalog.raw_schema.astrid_medications_disease_population"
    alias: "astrid_medications_disease_population"
    description: "Source table for medication data in disease population."

  - name: "raw_catalog.raw_schema.astrid_medications_general_population"
    alias: "astrid_medications_general_population"
    description: "Source table for medication data in general population."

