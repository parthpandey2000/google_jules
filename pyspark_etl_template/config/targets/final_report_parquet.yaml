# Target Configuration: final_report_parquet.yaml
target_name: "final_report_parquet"
description: "Final aggregated report to be saved as Parquet files."
target_type: "file" # Could be 'database', 'api', 'data_warehouse_table', etc.

# File-specific configurations
format: "parquet"
path: "data/output/final_report" # Relative to project root, or use absolute path

# Write mode for Spark DataFrameWriter
# Options: "overwrite", "append", "ignore", "error", "errorifexists"
write_mode: "overwrite" # Common for batch ETL jobs to replace the output

# Parquet specific options
options:
  compression: "snappy" # e.g., "none", "snappy", "gzip", "lzo"
  # Other Parquet options like:
  # "maxRecordsPerFile": 1000000

# Partitioning strategy for the output (optional)
# This defines how the data will be structured on disk for efficient querying.
partition_by: # List of column names to partition by
  # - "processing_date"
  # - "region"
  - "year"
  - "month"
# The final_report_df should have 'year' and 'month' columns if partitioning is used.

# Schema validation before writing (optional)
# Ensures the DataFrame being written matches an expected schema.
# schema:
